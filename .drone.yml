kind: pipeline
type: docker
name: java-rootless-image-validation

node:
  ci-role: rootless-image-smoke
  platform: linux-amd64

trigger:
  repo:
    - kernel528/java-docker
  branch:
    - '25'
    - main
  event:
    - pull_request
    - push
    - custom

steps:
  - name: build-and-smoke
    image: docker:27-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_BUILDKIT: "0"
    commands:
      - scripts/ci-rootless-java-smoke.sh
    volumes:
      - name: podman-socket
        path: /var/run/docker.sock

volumes:
  - name: podman-socket
    host:
      path: /run/user/1001/podman/podman.sock

---

kind: pipeline
type: docker
name: java-maintenance-candidate

trigger:
  repo:
    - kernel528/java-docker
  branch:
    - '25'
  event:
    - push

services:
  - name: docker
    image: docker:27.5.1-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - name: candidate-dockersock
        path: /var/run

steps:
  - name: build-and-smoke-candidate
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      JAVA_IMAGE_REPO: kernel528/java
    volumes:
      - name: candidate-dockersock
        path: /var/run
    commands:
      - scripts/ci-build-java-candidate.sh

  - name: publish-candidate
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      JAVA_IMAGE_REPO: kernel528/java
      DOCKER_USERNAME:
        from_secret: docker_username
      DOCKER_PASSWORD:
        from_secret: docker_password
    volumes:
      - name: candidate-dockersock
        path: /var/run
    commands:
      - scripts/ci-publish-java-candidate.sh

  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts

volumes:
  - name: candidate-dockersock
    temp: {}

---

kind: pipeline
type: docker
name: main-java-amd64

trigger:
  repo:
    - kernel528/java-docker
  branch:
    - main
  event:
    - push

steps:
  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts

---

kind: pipeline
type: docker
name: java-immutable-release

# Release tags are manually created from a reviewed main commit. Drone tag
# events are not branch-associated; the build script validates tag metadata.
trigger:
  repo:
    - kernel528/java-docker
  event:
    - tag

services:
  - name: docker
    image: docker:27.5.1-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - name: release-dockersock
        path: /var/run

steps:
  - name: build-and-smoke-release
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      JAVA_IMAGE_REPO: kernel528/java
    volumes:
      - name: release-dockersock
        path: /var/run
    commands:
      - scripts/ci-build-java-release.sh

  - name: check-immutable-tags-unused
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      JAVA_IMAGE_REPO: kernel528/java
    volumes:
      - name: release-dockersock
        path: /var/run
    commands:
      - scripts/ci-check-java-release-tags-unused.sh

  - name: publish-immutable-release
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      JAVA_IMAGE_REPO: kernel528/java
      DOCKER_USERNAME:
        from_secret: docker_username
      DOCKER_PASSWORD:
        from_secret: docker_password
    volumes:
      - name: release-dockersock
        path: /var/run
    commands:
      - scripts/ci-publish-java-release.sh

  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts

volumes:
  - name: release-dockersock
    temp: {}
